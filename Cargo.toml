[package]
name = "datavis"
version = "0.0.4"
edition = "2021"
description = "Desktop tool for watching streaming telemetry in real time"
license = "GPL-3.0"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
anyhow = "1.0"
egui_plot = "0.28"
rustfft = "6"
serde_json = "1"
egui_tiles = { version = "0.9", features = ["serde"] }
zmq = "0.10"
prost-reflect = "0.14"
protox = "0.7"
mcap = "0.8"
rfd = "0.14"
crossbeam-channel = "0.5"
prost-types = "0.13"
rumqttc = "0.24"
boxcar = "0.2.14"
egui-phosphor = "0.6"
tungstenite = "0.21"
pyo3 = { version = "0.22", features = ["auto-initialize"], optional = true }
numpy = { version = "0.22", optional = true }

# `scripting` is on by default. It pulls in PyO3/numpy, which require a Python
# interpreter (python3 + python3-config) on PATH at build time — build inside
# the `nix develop` shell (it provides python3 + numba) or install python3-dev.
# Build the base app without a Python toolchain via `--no-default-features`.
[features]
default = ["scripting"]
scripting = ["dep:pyo3", "dep:numpy"]

[dev-dependencies]
tempfile = "3"

# Cargo subcommand binaries used for dependency hygiene. These are installed
# tools, not library dependencies — install with:
#   cargo install cargo-machete
#   cargo install cargo-udeps   # requires a nightly toolchain
# and run with:
#   cargo machete
#   cargo +nightly udeps
[package.metadata.dev-tools]
cargo-machete = "0.9"
cargo-udeps = "0.1"

# Debian packaging (cargo-deb). Runtime library dependencies are resolved
# automatically from the linked binary via dpkg-shlibdeps ($auto). The .deb
# is built inside each target distro's container so the shared-library
# versions it depends on match that release.
[package.metadata.deb]
section = "science"
priority = "optional"
depends = "$auto, python3, python3-numba, python3-numpy"
assets = [
    ["target/release/datavis", "usr/bin/", "755"],
    ["config.toml", "usr/share/datavis/config.toml", "644"],
    ["README.md", "usr/share/doc/datavis/README.md", "644"],
]
extended-description = """\
Pulls in live telemetry over MQTT, WebSocket, ZeroMQ and InfluxDB line \
protocol, decodes it (Protobuf schemas picked up at runtime) and draws it \
in a workspace of panels you arrange yourself. Sessions can be recorded to \
MCAP and scrubbed back through the same panels."""
