name: Debian packages

# Build .deb packages for several Debian/Ubuntu releases. Each job runs inside
# the target distro's own container so the binary links against — and the
# package depends on — that release's shared-library versions.

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

jobs:
  build-deb:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-12
            image: debian:12
          - name: debian-13
            image: debian:13
          - name: ubuntu-22.04
            image: ubuntu:22.04
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: ubuntu-25.04
            image: ubuntu:25.04

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            libgtk-3-dev \
            libzmq3-dev \
            dpkg-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb --output "target/debian/datavis-${{ matrix.name }}.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: datavis-${{ matrix.name }}
          path: target/debian/*.deb
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build-deb
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
