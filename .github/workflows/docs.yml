name: Docs

# Build the rustdoc API docs and publish them to GitHub Pages. Pages must be
# configured with "Source: GitHub Actions" (Settings → Pages). libgtk-3-dev is
# needed to compile the crate; libzmq/libsodium are vendored and built from
# source by zeromq-src (the runner ships CMake), so no system ZeroMQ is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push cancels an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build docs
        run: cargo doc --no-deps --locked
        env:
          # Fail the build on broken intra-doc links.
          RUSTDOCFLAGS: -D warnings

      - name: Redirect root to the crate index
        run: echo '<meta http-equiv="refresh" content="0; url=datavis/index.html">' > target/doc/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
